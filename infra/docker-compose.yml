# Postgres and Redis for contributors who prefer containers.
#
# Nothing in this repository requires it: the suites talk to whatever `DATABASE_URL` and
# `REDIS_URL` point at, so a Postgres and a Redis installed natively work just as well, and
# that is how the project is developed day to day. Bring these up when you would rather not
# install either.
#
#   docker compose -f infra/docker-compose.yml up -d
#   export DATABASE_URL=postgres://bookrail:bookrail@localhost:5432/bookrail_dev
#   export REDIS_URL=redis://localhost:6379
#
# The versions are the ones CI runs (`.github/workflows/ci.yml`), so a failure here is a
# failure there. Postgres 15 is the oldest release the schema can be applied to, because it
# uses a list of columns in `ON DELETE SET NULL`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bookrail
      POSTGRES_PASSWORD: bookrail
      POSTGRES_DB: bookrail_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bookrail -d bookrail_dev']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
